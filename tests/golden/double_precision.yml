description: 64-bit add via carry flag + ADC
source: |
  ; Double-precision (64-bit) addition using the hardware carry flag (C) and
  ; the ADC instruction. A 64-bit number is stored as two 32-bit machine words
  ; (hi, lo):
  ;
  ;   (+ alo blo)    -> ADD: low word; sets C on unsigned 32-bit overflow
  ;   (adc ahi bhi)  -> ADC: high word; folds in the carry from the low add
  ;
  ; Nothing between the two operations touches C (loads / setq / drop all leave
  ; the flag intact), so the carry propagates correctly from low to high.
  ;
  ; Demonstrated:
  ;   A = 7_294_967_296  = (1, 3_000_000_000)
  ;   B = 10_589_934_592 = (2, 2_000_000_000)
  ;   A + B = 17_884_901_888 = (4, 705_032_704)
  ; Expected output:  hi=4 lo=705032704

  (setq ahi 1)
  (setq alo 3000000000)
  (setq bhi 2)
  (setq blo 2000000000)

  (setq lo (+ alo blo))      ; ADD sets carry
  (setq hi (adc ahi bhi))    ; ADC consumes carry

  (print-string "hi=")
  (print-int hi)
  (print-string " lo=")
  (print-int lo)
  (print-char 10)
  (halt)
stdin: ''
expected_stdout: |
  hi=4 lo=705032704
tick_limit: 1000000
log_enabled: true
log_head_lines: 8
expected_log_head: |
  T00001  m_PC=01 FETCH       PC=0001  IR=02001067  TOS=          0  A=0000 B=0000  DS[0]  RS[0]  Z=0 N=0 C=0
  T00002  m_PC=04 DECODE      PC=0001  IR=02001067  TOS=          0  A=0000 B=0000  DS[0]  RS[0]  Z=0 N=0 C=0  ; JMP 0x1067
  T00003  m_PC=00 JMP         PC=1067  IR=02001067  TOS=          0  A=0000 B=0000  DS[0]  RS[0]  Z=0 N=0 C=0
  T00004  m_PC=01 FETCH       PC=1068  IR=00000000  TOS=          0  A=0000 B=0000  DS[0]  RS[0]  Z=0 N=0 C=0
  T00005  m_PC=02 DECODE      PC=1068  IR=00000000  TOS=          0  A=0000 B=0000  DS[0]  RS[0]  Z=0 N=0 C=0  ; NOP
  T00006  m_PC=00 NOP         PC=1068  IR=00000000  TOS=          0  A=0000 B=0000  DS[0]  RS[0]  Z=0 N=0 C=0
  T00007  m_PC=01 FETCH       PC=1069  IR=40000001  TOS=          0  A=0000 B=0000  DS[0]  RS[0]  Z=0 N=0 C=0
  T00008  m_PC=31 DECODE      PC=1069  IR=40000001  TOS=          0  A=0000 B=0000  DS[0]  RS[0]  Z=0 N=0 C=0  ; PUSH 0x0001
log_tail_lines: 4
expected_log_tail: |
  T01001  m_PC=01 FETCH       PC=1097  IR=01000000  TOS=          0  A=0000 B=0000  DS[0]  RS[0]  Z=0 N=0 C=0
  T01002  m_PC=03 DECODE      PC=1097  IR=01000000  TOS=          0  A=0000 B=0000  DS[0]  RS[0]  Z=0 N=0 C=0  ; HALT
  T01003  m_PC=03 HALT        PC=1097  IR=01000000  TOS=          0  A=0000 B=0000  DS[0]  RS[0]  Z=0 N=0 C=0  ; HALT
  ; halted: HALT
listing_head_lines: 8
