  T01134  m_PC=01 FETCH       PC=10C7  IR=01000000  TOS=          0  A=0000 B=0000  DS[0]  RS[0]  Z=0 N=0
  T01135  m_PC=03 DECODE      PC=10C7  IR=01000000  TOS=          0  A=0000 B=0000  DS[0]  RS[0]  Z=0 N=0  ; HALT
  T01136  m_PC=03 HALT        PC=10C7  IR=01000000  TOS=          0  A=0000 B=0000  DS[0]  RS[0]  Z=0 N=0  ; HALT
  ; halted: HALT
