description: 'cat: echo until EOF'
source: |
  ; Echo input characters until the input buffer is exhausted, at which point
  ; the simulator halts (per the stream variant: empty buffer => HaltError).
  (defun cat ()
    (progn
      (print-char (read-char))
      (cat)))
  (cat)
stdin: meow!
expected_stdout: meow!
tick_limit: 1000000
log_enabled: true
log_head_lines: 8
expected_log_head: |
  T00001  m_PC=01 FETCH       PC=0001  IR=02001067  TOS=          0  A=0000 B=0000  DS[0]  RS[0]  Z=0 N=0 C=0
  T00002  m_PC=04 DECODE      PC=0001  IR=02001067  TOS=          0  A=0000 B=0000  DS[0]  RS[0]  Z=0 N=0 C=0  ; JMP 0x1067
  T00003  m_PC=00 JMP         PC=1067  IR=02001067  TOS=          0  A=0000 B=0000  DS[0]  RS[0]  Z=0 N=0 C=0
  T00004  m_PC=01 FETCH       PC=1068  IR=00000000  TOS=          0  A=0000 B=0000  DS[0]  RS[0]  Z=0 N=0 C=0
  T00005  m_PC=02 DECODE      PC=1068  IR=00000000  TOS=          0  A=0000 B=0000  DS[0]  RS[0]  Z=0 N=0 C=0  ; NOP
  T00006  m_PC=00 NOP         PC=1068  IR=00000000  TOS=          0  A=0000 B=0000  DS[0]  RS[0]  Z=0 N=0 C=0
  T00007  m_PC=01 FETCH       PC=1069  IR=02001070  TOS=          0  A=0000 B=0000  DS[0]  RS[0]  Z=0 N=0 C=0
  T00008  m_PC=04 DECODE      PC=1069  IR=02001070  TOS=          0  A=0000 B=0000  DS[0]  RS[0]  Z=0 N=0 C=0  ; JMP 0x1070
log_tail_lines: 4
expected_log_tail: |
  T00114  m_PC=00 NOP         PC=106A  IR=00000000  TOS=          0  A=0000 B=0000  DS[0]  RS[6]  Z=0 N=0 C=0
  T00115  m_PC=01 FETCH       PC=106B  IR=30000000  TOS=          0  A=0000 B=0000  DS[0]  RS[6]  Z=0 N=0 C=0
  T00116  m_PC=29 DECODE      PC=106B  IR=30000000  TOS=          0  A=0000 B=0000  DS[0]  RS[6]  Z=0 N=0 C=0  ; INPUT 0x0000
  ; halted: input buffer exhausted
